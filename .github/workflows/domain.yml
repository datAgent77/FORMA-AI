name: Offline product behavior
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DomainHarness/DomainHarness.csproj --configuration Release
      - run: dotnet run --project tests/ProductHarness/ProductHarness.csproj --configuration Release
      - run: dotnet run --project tests/AdaptiveHarness/AdaptiveHarness.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tools/test-web-simulation.sh
      - run: python3 tools/validate-source.py
