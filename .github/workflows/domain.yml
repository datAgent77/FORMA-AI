name: Domain behavior
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DomainHarness/DomainHarness.csproj --configuration Release
      - run: python3 tools/validate-source.py
